<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Cockpit de performance Kiabi" />
  <title>Kiabi - Cockpit de performance</title>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "lucide-react": "https://esm.sh/lucide-react@0.468.0?external=react"
    }
  }
  </script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <style>
    html, body, #root { min-height: 100%; margin: 0; }
    body { background: #fff; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import React from "react";
    import { createRoot } from "react-dom/client";

    const source = await fetch("./App.jsx").then((response) => {
      if (!response.ok) throw new Error(`Impossible de charger App.jsx (${response.status})`);
      return response.text();
    });
    const compiled = Babel.transform(source, {
      presets: ["react"],
      sourceType: "module",
      filename: "App.jsx"
    }).code;
    const moduleUrl = URL.createObjectURL(new Blob([compiled], { type: "text/javascript" }));
    const { default: App } = await import(moduleUrl);

    createRoot(document.getElementById("root")).render(
      React.createElement(React.StrictMode, null, React.createElement(App))
    );
  </script>
</body>
</html>
